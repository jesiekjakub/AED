# Render Blueprint: publiczne demo frontendu portalu ze stroną /pl/aed.
#
# Blueprint tworzy dwa darmowe zasoby i nic poza nimi (bez baz danych, workerów
# i płatnych planów):
#   1. aed-na-ratunek        strona statyczna z frontendem portalu,
#   2. aed-na-ratunek-proxy  usługa na planie `free`, która przekazuje zapytania
#                            frontendu do produkcyjnego dane.gov.pl.
#
# To odpowiednik lokalnego `ng serve --configuration aed`:
#   - dane AED pochodzą z portal/src/assets/aed,
#   - zapytania /api, /media, /flags i /cms trafiają do dane.gov.pl (te same reguły
#     co w portal/proxy.aed.conf.json, zapisane w render/proxy.mjs).
# Wykaz zbiorczy z naszego backendu (/api/aggregated-aed-info) wymaga pełnego
# portalu uruchomionego lokalnie, więc w tym demo nie jest dostępny.
#
# Usługa na planie `free` zasypia po 15 minutach bez ruchu. Mapa i dane AED działają
# wtedy od razu, a treści z dane.gov.pl (stopka, okno RODO, wyszukiwarka danych)
# pojawiają się po wybudzeniu proxy, co trwa do około minuty.
services:
  - type: web
    runtime: static
    name: aed-na-ratunek
    # Konfiguracja `development` zostawia environment.production = false, więc aplikacja
    # woła API pod względnym adresem /api. W konfiguracji `production` szukałaby go pod
    # api.<domena strony>, czyli pod adresem, którego na Renderze nie ma.
    # Pozostałe flagi włączają optymalizację paczki jak w buildzie produkcyjnym.
    buildCommand: cd portal && npm ci --include=dev --no-audit --no-fund && npx ng build --configuration development --optimization --no-source-map --no-named-chunks --output-hashing all
    staticPublishPath: portal/dist/frontend/browser
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - portal/**
        - render.yaml
    envVars:
      - key: NODE_VERSION
        value: 24.13.0
    routes:
      # Zapytania do dane.gov.pl idą przez proxy, a nie wprost: Render dokleja do reguł
      # rewrite nagłówek X-Forwarded-Host, na który dane.gov.pl odpowiada przekierowaniem 301.
      - type: rewrite
        source: /api/*
        destination: https://aed-na-ratunek-proxy.onrender.com/api/*
      - type: rewrite
        source: /media/*
        destination: https://aed-na-ratunek-proxy.onrender.com/media/*
      - type: rewrite
        source: /flags/*
        destination: https://aed-na-ratunek-proxy.onrender.com/flags/*
      - type: rewrite
        source: /cms/*
        destination: https://aed-na-ratunek-proxy.onrender.com/cms/*
      # Aplikacja jednostronicowa: każdy inny adres obsługuje router Angulara.
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    runtime: node
    plan: free
    name: aed-na-ratunek-proxy
    region: frankfurt
    # Proxy korzysta tylko z modułów wbudowanych w Node.js, więc nie ma czego instalować.
    buildCommand: node --version
    startCommand: node render/proxy.mjs
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - render/**
        - render.yaml
    envVars:
      - key: NODE_VERSION
        value: 24.13.0
